  <style>
    :root{
      --red:#c0003a;--red-dark:#8a0028;--red-deep:#1a0008;
      --bg:#120008;--bg-mid:#1a000e;--white:#fff;
      --gray-light:#d4c4cb;--gray-mid:#9a7f89;--gray-dark:#3a1a24;
      --fh:'Montserrat',sans-serif;
    }
    *{margin:0;padding:0;box-sizing:border-box;}
    body{background:var(--bg);color:var(--white);font-family:'Open Sans',sans-serif;min-height:100vh;}

    /* NAVBAR */
    nav{
      position:sticky;top:0;z-index:100;
      background:rgba(18,0,8,.97);backdrop-filter:blur(8px);
      border-bottom:2px solid var(--red-deep);
      padding:0 24px;height:70px;
      display:flex;align-items:center;justify-content:space-between;
    }
    nav a.logo{display:flex;align-items:center;gap:10px;text-decoration:none;}
    nav a.logo img{height:44px;}
    nav a.back{
      font-family:var(--fh);font-size:.7rem;font-weight:700;letter-spacing:.12em;
      text-transform:uppercase;color:var(--gray-light);text-decoration:none;
      display:flex;align-items:center;gap:6px;transition:color .2s;
    }
    nav a.back:hover{color:var(--white);}
    nav a.back svg{width:16px;height:16px;fill:currentColor;}

    /* HERO DA GALERIA */
    .gal-hero{
      padding:60px 24px 40px;text-align:center;
      background:linear-gradient(180deg, var(--red-deep) 0%, var(--bg) 100%);
    }
    .gal-hero h1{font-family:var(--fh);font-size:clamp(2rem,5vw,3.2rem);font-weight:900;text-transform:uppercase;}
    .gal-hero h1 span{color:var(--red);}
    .gal-hero p{color:var(--gray-light);margin-top:12px;font-size:.9rem;}

    /* FILTROS */
    .gal-controls{
      max-width:1200px;margin:0 auto;padding:32px 24px 0;
      display:flex;flex-wrap:wrap;align-items:center;gap:12px;
    }
    .gal-controls input{
      flex:1;min-width:200px;max-width:320px;
      background:var(--bg-mid);border:1px solid var(--gray-dark);
      border-radius:50px;padding:10px 18px;color:var(--white);
      font-size:.82rem;font-family:'Open Sans',sans-serif;outline:none;
      transition:border-color .2s;
    }
    .gal-controls input:focus{border-color:var(--red);}
    .gal-controls input::placeholder{color:var(--gray-mid);}
    .filter-btns{display:flex;flex-wrap:wrap;gap:8px;}
    .fbtn{
      font-family:var(--fh);font-size:.64rem;font-weight:700;letter-spacing:.1em;
      text-transform:uppercase;padding:8px 16px;border-radius:50px;cursor:pointer;
      border:1.5px solid var(--gray-dark);background:transparent;color:var(--gray-mid);
      transition:.2s;
    }
    .fbtn:hover{border-color:var(--red);color:var(--white);}
    .fbtn.active{background:var(--red);border-color:var(--red);color:var(--white);}
    .gal-count{margin-left:auto;font-size:.75rem;color:var(--gray-mid);}
    .config-tip strong{color:var(--gray-light);}

    /* GRID */
    .gal-main{max-width:1200px;margin:0 auto;padding:24px;}
    .gal-grid{
      display:grid;
      grid-template-columns:repeat(auto-fill, minmax(260px,1fr));
      gap:12px;
    }
    .gal-item{
      position:relative;overflow:hidden;border-radius:4px;
      background:var(--bg-mid);cursor:pointer;
      aspect-ratio:4/3;
    }
    .gal-item img{
      width:100%;height:100%;object-fit:cover;
      transition:transform .4s ease;display:block;
    }
    .gal-item:hover img{transform:scale(1.06);}
    .gal-item.hidden{display:none;}

    /* SKELETON */
    .skeleton{
      background:linear-gradient(90deg, var(--bg-mid) 25%, var(--gray-dark) 50%, var(--bg-mid) 75%);
      background-size:200% 100%;
      animation:shimmer 1.4s infinite;
      border-radius:4px;
      aspect-ratio:4/3;
    }
    @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

    /* LOAD MORE */
    .load-wrap{text-align:center;margin:32px 0;}
    .btn-load-more{
      font-family:var(--fh);font-size:.72rem;font-weight:700;letter-spacing:.12em;
      text-transform:uppercase;padding:14px 36px;
      background:transparent;border:2px solid var(--red);color:var(--red);
      border-radius:4px;cursor:pointer;transition:.2s;
    }
    .btn-load-more:hover{background:var(--red);color:var(--white);}
    .btn-load-more:disabled{opacity:.4;cursor:default;}

    /* EMPTY STATE */
    .empty{text-align:center;padding:60px 24px;color:var(--gray-mid);}
    .empty svg{width:48px;height:48px;fill:var(--gray-dark);margin-bottom:16px;}
    .empty p{font-size:.88rem;}

    /* LIGHTBOX */
    #lb{
      display:none;position:fixed;inset:0;z-index:9999;
      background:rgba(0,0,0,.95);
      align-items:center;justify-content:center;
      flex-direction:column;gap:16px;
    }
    #lb.open{display:flex;}
    #lb img{max-width:90vw;max-height:85vh;object-fit:contain;border-radius:4px;}
    #lb-close{
      position:fixed;top:20px;right:24px;
      background:rgba(255,255,255,.1);border:none;color:var(--white);
      width:42px;height:42px;border-radius:50%;font-size:1.4rem;cursor:pointer;
      display:flex;align-items:center;justify-content:center;transition:.2s;
    }
    #lb-close:hover{background:var(--red);}
    #lb-nav{display:flex;gap:16px;}
    .lb-arrow{
      background:rgba(192,0,58,.3);border:2px solid var(--red);color:var(--white);
      width:48px;height:48px;border-radius:50%;font-size:1.3rem;cursor:pointer;
      display:flex;align-items:center;justify-content:center;transition:.2s;
    }
    .lb-arrow:hover{background:var(--red);}

    /* FOOTER */
    footer{
      text-align:center;padding:32px 24px;
      border-top:1px solid var(--gray-dark);
      color:var(--gray-mid);font-size:.75rem;
    }
    footer a{color:var(--red);text-decoration:none;}

    @media(max-width:600px){
      .gal-grid{grid-template-columns:repeat(2,1fr);gap:8px;}
      
    }

<script>
  // ── Estado ──
  var currentFilter = 'all';
  var cloudPhotos = [];
  var cloudPage = 0;
  var cloudPerPage = 24;
  var lbItems = [];
  var lbIndex = 0;

  // ── Filtros ──
  function setFilter(btn, tag) {
    document.querySelectorAll('.fbtn').forEach(function(b){ b.classList.remove('active'); });
    btn.classList.add('active');
    currentFilter = tag;
    applyFilters();
  }

  function applyFilters() {
    var searchEl = document.getElementById('searchInput');
    var search = searchEl ? searchEl.value.toLowerCase() : '';
    var items = document.querySelectorAll('#galGrid .gal-item, #cloudGrid .gal-item');
    var visible = 0;
    items.forEach(function(item) {
      var tag = item.getAttribute('data-tag') || '';
      var title = (item.getAttribute('data-title') || '').toLowerCase();
      var matchFilter = (currentFilter === 'all' || tag === currentFilter);
      var matchSearch = (!search || title.includes(search));
      if (matchFilter && matchSearch) { item.classList.remove('hidden'); visible++; }
      else { item.classList.add('hidden'); }
    });
    var countEl = document.getElementById('galCount');
    if (countEl) countEl.textContent = visible + ' fotos';
    document.getElementById('emptyState').style.display = (visible === 0) ? 'block' : 'none';
  }

  // ── Cloudinary ──
  // Cloudinary hardcoded
  var CLOUD_NAME = 'dgqxadsmt';
  var CLOUD_TAG  = 'mulhernaosecale'; // tag usada no upload

  function loadCloudinary() {
    cloudPhotos = [];
    cloudPage = 0;
    document.getElementById('cloudGrid').innerHTML = '';
    var sk = '';
    for (var i=0; i<6; i++) sk += '<div class="skeleton"></div>';
    document.getElementById('cloudGrid').innerHTML = sk;
    var url = 'https://res.cloudinary.com/' + CLOUD_NAME + '/image/list/' + CLOUD_TAG + '.json';
    fetch(url)
      .then(function(r){
        if(!r.ok) throw new Error('Tag não encontrada (code ' + r.status + ')');
        return r.json();
      })
      .then(function(data) {
        cloudPhotos = (data.resources || []).map(function(r){
          return {
            url:   'https://res.cloudinary.com/' + CLOUD_NAME + '/image/upload/c_fill,w_800,h_600,q_auto/' + r.public_id + '.webp',
            full:  'https://res.cloudinary.com/' + CLOUD_NAME + '/image/upload/q_auto/' + r.public_id + '.webp',
            title: r.public_id.replace(/.*\//, '').replace(/_/g,' ')
          };
        });
        document.getElementById('cloudGrid').innerHTML = '';
        if (cloudPhotos.length > 0) {
          renderCloudPage();
        } else {
          document.getElementById('cloudGrid').innerHTML =
            '<p style="color:var(--gray-mid);font-size:.82rem;padding:16px 0;">Nenhuma foto encontrada com a tag <em>' + CLOUD_TAG + '</em>. Faça upload das fotos no Cloudinary com essa tag.</p>';
        }
      })
      .catch(function(err){
        document.getElementById('cloudGrid').innerHTML =
          '<p style="color:var(--gray-mid);font-size:.82rem;padding:16px 0;">Cloudinary: ' + err.message + '<br>Certifique-se de que as fotos foram subidas com a tag <strong>' + CLOUD_TAG + '</strong>.</p>';
      });
  }

  function renderCloudPage() {
    var start = cloudPage * cloudPerPage;
    var end = Math.min(start + cloudPerPage, cloudPhotos.length);
    var grid = document.getElementById('cloudGrid');
    for (var i = start; i < end; i++) {
      (function(photo, idx){
        var div = document.createElement('div');
        div.className = 'gal-item';
        div.setAttribute('data-tag', '2025');
        div.setAttribute('data-title', photo.title);
        div.setAttribute('data-cloud-idx', idx);
        div.innerHTML = '<img src="' + photo.url + '" alt="' + (photo.title || 'Mulher Não Se Cale') + '" loading="lazy" onclick="openCloudLB(' + idx + ')"/>';
        grid.appendChild(div);
      })(cloudPhotos[i], i);
    }
    cloudPage++;
    document.getElementById('loadWrap').style.display = (end < cloudPhotos.length) ? 'block' : 'none';
    applyFilters();
  }

  function loadMoreCloud() {
    renderCloudPage();
  }

  // ── Lightbox ──
  function collectVisible() {
    lbItems = [];
    document.querySelectorAll('#galGrid .gal-item:not(.hidden), #cloudGrid .gal-item:not(.hidden)').forEach(function(item){
      var img = item.querySelector('img');
      if (img) lbItems.push(img.src);
    });
  }

  function openLB(src, item) {
    collectVisible();
    lbIndex = lbItems.indexOf(src);
    if (lbIndex < 0) lbIndex = 0;
    document.getElementById('lb-img').src = src;
    document.getElementById('lb').classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function openCloudLB(idx) {
    var photo = cloudPhotos[idx];
    if (!photo) return;
    collectVisible();
    document.getElementById('lb-img').src = photo.full || photo.url;
    document.getElementById('lb').classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function closeLB() {
    document.getElementById('lb').classList.remove('open');
    document.body.style.overflow = '';
  }

  function lbNav(dir) {
    lbIndex = (lbIndex + dir + lbItems.length) % lbItems.length;
    document.getElementById('lb-img').src = lbItems[lbIndex];
  }

  document.getElementById('lb').addEventListener('click', function(e){
    if (e.target === this) closeLB();
  });
  document.addEventListener('keydown', function(e){
    if (!document.getElementById('lb').classList.contains('open')) return;
    if (e.key === 'Escape') closeLB();
    if (e.key === 'ArrowLeft') lbNav(-1);
    if (e.key === 'ArrowRight') lbNav(1);
  });

  // Inicializar contagem e carregar Cloudinary automaticamente
  applyFilters();
  loadCloudinary();
</script>
</body>
</html>
